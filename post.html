<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Abdukarim Qarshiyev</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- highlight.js — kod bloklarini rang-barang qiladi (Java, Python, JS...) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="container">
    <!-- breadcrumb: blogs / post-nomi -->
    <div class="breadcrumb">
      <a href="blog.html">blogs</a>
      <span>/</span>
      <span class="slug" id="crumb-slug"></span>
    </div>

    <h1 class="post-title" id="post-title">Yuklanmoqda...</h1>
    <p class="post-meta" id="post-meta"></p>

    <!-- Markdown shu yerga HTML bo'lib chiziladi -->
    <article class="post-content" id="post-content"></article>
  </main>

  <script src="js/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/posts.js"></script>
  <script>
    // 1. URL'dan qaysi post kerakligini olamiz: post.html?post=salom-dunyo
    const slug = new URLSearchParams(location.search).get("post");
    const post = POSTS.find((p) => p.slug === slug);

    const titleEl = document.getElementById("post-title");
    const metaEl = document.getElementById("post-meta");
    const contentEl = document.getElementById("post-content");
    document.getElementById("crumb-slug").textContent = slug || "";

    if (!post) {
      // Bunday post ro'yxatda yo'q
      titleEl.textContent = "Post topilmadi";
      contentEl.innerHTML =
        '<p>Bunday post mavjud emas. <a href="blog.html">Blogga qaytish</a></p>';
    } else {
      titleEl.textContent = post.title;
      document.title = post.title + " — Abdukarim Qarshiyev";
      metaEl.textContent = `${post.date}  ·  ${post.readTime}`;

      // 2. posts/ papkasidan .md faylni yuklaymiz
      fetch(`posts/${slug}.md`)
        .then((res) => {
          if (!res.ok) throw new Error("Fayl topilmadi");
          return res.text();
        })
        .then((markdown) => {
          // 3. Markdown matnini HTML'ga aylantiramiz (marked.js)
          contentEl.innerHTML = marked.parse(markdown);
          // 4. Kod bloklarini ranglaymiz (highlight.js)
          contentEl.querySelectorAll("pre code").forEach((block) => {
            hljs.highlightElement(block);
          });
        })
        .catch(() => {
          contentEl.innerHTML =
            "<p><strong>Xatolik:</strong> posts/" + slug + ".md fayli topilmadi. " +
            "Eslatma: sayt lokal server orqali ochilishi kerak (README ga qarang).</p>";
        });
    }
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
