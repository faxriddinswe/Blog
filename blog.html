<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Faxriddin Baxtiyorov</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="container">
    <h1 class="page-title">Dasturchi kundaligi</h1>

    <!-- Postlar ro'yxati JS orqali shu yerga chiziladi -->
    <ul class="blog-list" id="blog-list"></ul>
  </main>

  <script src="js/posts.js"></script>
  <script>
    // posts.js dagi POSTS ro'yxatidan har bir post uchun qator yasaymiz.
    // Har bir qator post.html?post=SLUG sahifasiga olib boradi.
    const list = document.getElementById("blog-list");

    list.innerHTML = POSTS.map(
      (p) => `
      <li class="blog-item">
        <a href="post.html?post=${p.slug}">
          <h2>${p.title}</h2>
          <time datetime="${p.date}">${p.date}</time>
        </a>
      </li>`
    ).join("");
  </script>
  <script src="js/nav.js"></script>
</body>

</html>
