<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faxriddin Baxtiyorov</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="container">
    <h1 class="page-title left">Building</h1>
    <p class="page-subtitle">
      Public repositories from
      <a href="https://github.com/faxriddinswe" target="_blank" rel="noopener">@faxriddinswe</a>
      — my projects on GitHub.
    </p>

    <!-- Loyihalar JS orqali shu yerga chiziladi -->
    <div class="projects" id="projects"></div>
  </main>

  <script src="js/projects.js"></script>
  <script>
    // projects.js dagi PROJECTS ro'yxatidan kartalar yasaymiz.
    // Har bir karta <a> — bosilganda GitHub'dagi repo sahifasi ochiladi.
    const wrap = document.getElementById("projects");

    wrap.innerHTML = PROJECTS.map(
      (p) => `
      <a class="project-card" href="${p.url}" target="_blank" rel="noopener">
        <div class="head">
          <h2>${p.name}</h2>
          ${p.stars ? `<span class="stars">★ ${p.stars}</span>` : ""}
        </div>
        ${p.desc ? `<p class="desc">${p.desc}</p>` : ""}
        <div class="meta">
          ${p.lang ? `<span class="lang">${p.lang}</span>` : ""}
          ${p.date ? `<span>${p.date}</span>` : ""}
        </div>
      </a>`
    ).join("");
  </script>
  <script src="js/nav.js"></script>
</body>

</html>
